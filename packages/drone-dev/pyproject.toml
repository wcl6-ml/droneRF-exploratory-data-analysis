[project]
name = "drone-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wcl6-ml", email = "weichung.lai6@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
